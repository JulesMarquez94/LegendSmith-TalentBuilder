# Publishes the Talent Builder (SkillTreeBuilder/) to GitHub Pages on every push to main that
# touches it or its art. Run it by hand from the Actions tab with "Run workflow".
name: Talent Builder on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'SkillTreeBuilder/**'
      - 'Art/**'
      - '.github/workflows/talent-builder-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SkillTreeBuilder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SkillTreeBuilder/package-lock.json
      - run: npm ci
      - run: npm test
      # A project site lives at https://<user>.github.io/<repo>/, so assets need that prefix.
      - name: Build
        run: |
          repo="${{ github.event.repository.name }}"
          case "$repo" in
            *.github.io) base=/ ;;
            *) base="/$repo/" ;;
          esac
          npm run build -- --base "$base"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: SkillTreeBuilder/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
